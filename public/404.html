<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Expresión Latina</title>
    <script>
      // GitHub Pages has no server-side rewrite, so a direct request to a
      // client-side route such as /expresion-latina/schedules lands here.
      // Encode the requested path into a query string and hand it to
      // index.html, which decodes it back before React Router mounts.
      // Technique: https://github.com/rafgraph/spa-github-pages
      (function redirectToIndex(l) {
        // Number of leading path segments that belong to the host, not the
        // app. This site is served from a project page, so keep the repo name.
        var pathSegmentsToKeep = 1;

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '')
            + l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/')
            + '/?/'
            + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~')
            + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '')
            + l.hash
        );
      }(window.location));
    </script>
  </head>
  <body></body>
</html>
