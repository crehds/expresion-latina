# Supabase CLI configuration for the local development and test stack.
#
# Only the settings this project depends on are listed. Everything else uses
# the defaults of the pinned CLI (scripts/db/test-db.mjs and
# .github/workflows/db-tests.yml), so a deliberate change shows up here as a
# visible diff instead of being lost among ~400 lines of generated defaults.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "expresion-latina"

[api]
# The Data API exposes only these schemas. `private` must never be listed:
# its helpers are reachable only through the policies and functions that use
# them.
schemas = ["public", "graphql_public"]
# `auto_expose_new_tables` is deliberately left at the cloud default, so the
# catalog privilege guard tests the same default grants production applies.

[db]
# Match the Postgres major version of the hosted project.
major_version = 17
