# Runs the pgTAP suite against the local Supabase stack for every change
# that touches supabase/, scripts/db/ or package.json. This is the only
# place the Database Security Contract (RLS, grants, the catalog privilege
# guard) gets proven: Vitest only mocks the Supabase client and cannot
# exercise real Postgres RLS.
name: DB tests

on:
  pull_request:
    paths:
      - supabase/**
      - scripts/db/**
      - package.json
      - .github/workflows/db-tests.yml
  push:
    branches: [develop, main]
    paths:
      - supabase/**
      - scripts/db/**
      - package.json
      - .github/workflows/db-tests.yml

# Least privilege: this job only reads the repository and talks to the
# Supabase CLI's own Docker containers, so it needs no write access at all.
permissions:
  contents: read

jobs:
  pgtap:
    name: pgTAP (supabase test db)
    runs-on: ubuntu-latest
    # The stack pull, `db start` and pgTAP run are usually a couple of
    # minutes; this bounds a stuck Docker pull or a hung container instead
    # of running until the workflow's own default limit.
    timeout-minutes: 30

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      # Only for the helper-script unit tests below: they import node:assert
      # and node:test directly and have no dependency on the installed
      # packages, so this step runs no `npm ci` -- verified by reading
      # scripts/db/__tests__/*.test.mjs, which imports only node builtins
      # and sibling files under scripts/db/. (The version check among them
      # also reads this file, supabase/README.md and supabase/config.toml
      # as text.)
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The same npm script a contributor runs locally (package.json), so the
      # list of test files is written once.
      - name: Correr los tests de scripts/db
        run: npm run test:db-scripts

      # Pinned to the exact same CLI build `npm run test:db` uses locally (the
      # SUPABASE_CLI constant in scripts/db/test-db-lib.mjs), so a pgTAP
      # failure reproduces identically in both places. The version is written
      # out in four places: that constant, the `version:` below,
      # supabase/README.md and supabase/config.toml. Bump all four together:
      # the version check in the scripts/db tests above fails the job when one
      # is left behind.
      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.117.0

      # A fresh GitHub-hosted runner never has a previous database volume,
      # so `db start` alone already applies every migration on disk; unlike
      # `npm run test:db` locally, there is nothing here for `db reset` to
      # undo.
      - name: Iniciar la base de datos local
        run: supabase db start

      - name: Correr el suite pgTAP
        run: supabase test db
